<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add/Edit User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9fafb;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 30px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-inline {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .form-inline label {
            font-weight: normal;
            margin: 0;
        }
        .permissions {
            grid-column: 1 / -1;
        }
        .permissions label {
            display: inline-block;
            margin-right: 15px;
            font-weight: normal;
        }
        .buttons {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background-color: #2563eb;
            color: white;
        }
        .btn-secondary {
            background-color: #6b7280;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Add/Edit User</h2>
    <form th:action="@{/users}" th:object="${user}" method="post">
         <input type="hidden" th:if="${user.id != null}" name="_method" value="put" />
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label for="fullname">Fullname</label>
            <input type="text" id="fullname" th:field="*{fullname}" placeholder="Enter fullname" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" placeholder="Enter email" required>
        </div>

        <div class="form-group">
            <label for="department">Department</label>
            <select id="department" th:field="*{department}">
                <option th:each="dept : ${departments}" th:value="${dept}" th:text="${dept}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="role">Role</label>
            <select id="role" th:field="*{role}">
                <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" th:field="*{age}" min="0" placeholder="Enter age">
        </div>

        <div class="form-group">
            <label>Gender</label>
            <div class="form-inline">
                <label><input type="radio" th:field="*{gender}" value="Male"> Male</label>
                <label><input type="radio" th:field="*{gender}" value="Female"> Female</label>
            </div>
        </div>

        <div class="form-group" style="grid-column: 1 / -1;">
            <label for="biography">Biography</label>
            <textarea id="biography" th:field="*{biography}" placeholder="Write a short biography"></textarea>
        </div>

        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" th:field="*{dob}">
        </div>

        

        <div class="buttons">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/}" class="btn btn-secondary">Back</a>
        </div>
    </form>
</div>
</body>
</html>
