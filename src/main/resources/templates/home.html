<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Management System</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css"/>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
</head>
<body>
    <h1 style="text-align: center;">User Management System</h1>
    <div style="text-align: right;">Welcome: <span th:text="${username}" ></span>
       <br/><br/> <a th:href="@{/logout}">Logout</a>
    </div>
    <button onclick="location.href='/users/add'">Add User</button>
    
    <div><br/><br/></div>
    <table id="userTable" class="display">
        <thead>
            <tr>
                <th>Full Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
        </thead>
    </table>

    <script>
        $(document).ready(function () {
            var table = $("#userTable").DataTable({
                ajax: {
                    url: "/api/users",
                    type: "GET",
                    dataSrc: function (json) {
                        console.log("Users loaded successfully.", json);
                        return json; // return array so DataTables can render it
                    },
                    error: function(xhr, status, error) {
                        console.error("Error loading users:", error);
                        alert("Failed to load users.");
                    }
                },
                columns: [
                    { data: "fullname" },
                    { data: "email" },
                    { data: "department" },
                    { data: "role" },
                    {
                        data: null,
                        render: function (data, type, row) {
                            return '<button onclick="location.href=\'/users/edit/' + row.id + '\'">Edit</button> '
                                 + '<button onclick="deleteUser(' + row.id + ')">Delete</button>';
                        }
                    }
                ]
            });

            $("#globalSearch").on("keyup", function () {
                table.search(this.value).draw();
            });
        });

        function deleteUser(id) {
            if(confirm("Are you sure you want to delete this user?")) {
                $.ajax({
                    url: '/api/users/' + id,
                    type: 'DELETE',
                    success: function(result) {
                        alert("User deleted successfully.");
                        $('#userTable').DataTable().ajax.reload();
                    },
                    error: function(xhr, status, error) {
                        console.error("Delete failed:", error);
                        alert("Failed to delete user.");
                    }
                });
            }
        }
    </script>
</body>
</html>
